{% extends 'base.html' %}

{% block title %}Add New Herb Batch{% endblock %}

{% block content %}
  <h2>Step 1: Add New Herb Batch (Farmer)</h2>
  <form method="POST">
    <div class="form-group">
      <label for="herb_name">Herb Name (e.g., Ashwagandha, Tulsi)</label>
      <input type="text" id="herb_name" name="herb_name" required>
    </div>
    <div class="form-group">
      <label for="location">GPS Location or Area</label>
      <input type="text" id="location" name="location" placeholder="e.g., 12.97° N, 77.59° E or 'Farm in Kerala'" required>
    </div>
    <div class="form-group">
      <label for="notes">Harvest Notes</label>
      <textarea id="notes" name="notes" rows="3" placeholder="e.g., 'Organic, harvested post-monsoon'"></textarea>
    </div>
    <button type="submit" class="btn">Create Batch & Generate QR</button>
  </form>
{% endblock %}
