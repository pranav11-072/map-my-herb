{% extends 'base.html' %}

{% block title %}Update Batch Status{% endblock %}

{% block content %}
  <h2>Update Status for Batch: {{ batch_id }}</h2>
  <p>Current Status: <strong>{{ last_action }}</strong></p>
  
  <form method="POST">
    <div class="form-group">
      <label for="action">New Action</label>
      <select id="action" name="action">
        <option value="PROCESSED">PROCESSED</option>
        <option value="QUALITY_CHECKED">QUALITY_CHECKED</option>
        <option value="SHIPPED">SHIPPED</option>
        <option value="MANUFACTURED">MANUFACTURED</option>
      </select>
    </div>
    <div class="form-group">
      <label for="details">Details for this action</label>
      <textarea id="details" name="details" rows="3" placeholder="e.g., 'Processed by AyurPharma Inc.' or 'Shipped via truck A-42'" required></textarea>
    </div>
    <button type="submit" class="btn">Add to Chain</button>
  </form>
{% endblock %}
